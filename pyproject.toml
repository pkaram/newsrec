[project]
name = "newsrec"
version = "0.1.0"
description = "Framework to experiment on news recommendations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "implicit>=0.7.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
